<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إدارة الفعاليات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-navy: #232055;
            --accent-gold: #ecb02e;
            --white: #ffffff;
            --bg-color: #f4f4f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-navy);
            display: block;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Dashboard Screen */
        .dashboard-container {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(35, 32, 85, 0.08);
            overflow: hidden;
        }

        .dashboard-header {
            background: var(--primary-navy);
            color: var(--white);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .header-actions-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .logout-btn {
            background: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 6px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .logout-btn:hover {
            background: var(--accent-gold);
            color: var(--primary-navy);
        }

        .dashboard-body {
            padding: 40px;
        }

        .dashboard-body h3 {
            margin-bottom: 25px;
            color: var(--primary-navy);
            border-bottom: 2px solid rgba(236, 176, 46, 0.3);
            display: inline-block;
            padding-bottom: 5px;
        }

        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(236, 176, 46, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-navy);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-family: 'Cairo', sans-serif;
        }

        .btn-submit:hover {
            background: #1a1744;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(35, 32, 85, 0.2);
        }

        .toast {
            position: fixed; bottom: 30px; left: 30px;
            background: var(--primary-navy); color: var(--white);
            padding: 14px 22px; border-radius: 14px; font-weight: 700;
            font-size: 0.9rem; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(80px); opacity: 0;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1); z-index: 999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        .firebase-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; background: rgba(16,185,129,0.1);
            color: #059669; border-radius: 20px; font-size: 0.8rem;
            font-weight: 700; border: 1px solid rgba(16,185,129,0.2);
            margin-bottom: 20px;
        }
        .firebase-badge span {
            width: 7px; height: 7px; background: #10b981;
            border-radius: 50%; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        .manage-section {
            margin-top: 50px;
            border-top: 2px solid #eee;
            padding-top: 30px;
        }

        .events-table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
        }

        .events-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        .events-table th, .events-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .events-table th {
            background: #f8fafc;
            color: var(--primary-navy);
            font-weight: 800;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .status-open   { background: #dcfce7; color: #166534; }
        .status-soon   { background: #fef9c3; color: #854d0e; }
        .status-ended  { background: #fee2e2; color: #991b1b; }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            border: none;
            background: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn i { width: 18px; height: 18px; }

        .edit-btn   { color: #2563eb; }
        .edit-btn:hover   { background: #dbeafe; }
        .delete-btn { color: #dc2626; }
        .delete-btn:hover { background: #fee2e2; }
    </style>
</head>
<body>

    <!-- Check Session Storage for Authentication -->
    <script>
        if (sessionStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <!-- Dashboard Screen -->
    <div class="dashboard-container" id="dashboardScreen">
        <div class="dashboard-header">
            <h2>لوحة التحكم | إدارة الفعاليات</h2>
            <div class="header-actions-group">
                <a href="index.html" class="back-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    لوحة الاختيار
                </a>
                <button class="logout-btn" id="logoutBtn">تسجيل خروج</button>
            </div>
        </div>
        <div class="dashboard-body">

            <div class="firebase-badge">
                <span></span> متصل بـ Firebase — البيانات حية
            </div>

            <h3 id="formTitle">إضافة فعالية جديدة</h3>
            <form id="addEventForm" class="grid-form">
                <div class="form-group">
                    <label>عنوان الفعالية</label>
                    <input type="text" id="f_title" class="form-control" required placeholder="مثال: معسكر رواد الأعمال">
                </div>
                <div class="form-group">
                    <label>التصنيف</label>
                    <select id="f_category" class="form-control" required>
                        <option value="meeting">لقاءات</option>
                        <option value="program">برامج</option>
                        <option value="competition">مسابقات</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>التاريخ</label>
                    <input type="date" id="f_date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>الوقت</label>
                    <input type="time" id="f_time" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>مكان اللقاء</label>
                    <input type="text" id="f_location" class="form-control" required placeholder="مثال: مقر النادي - مبنى 4">
                </div>
                <div class="form-group">
                    <label>حالة التسجيل</label>
                    <select id="f_status" class="form-control" required>
                        <option value="open">مفتوح للتسجيل</option>
                        <option value="soon">قريباً</option>
                        <option value="ended">انتهى</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>رابط زر التسجيل (مثال: رابط Google Form)</label>
                    <input type="url" id="f_regLink" class="form-control" placeholder="https://forms.gle/...">
                </div>
                <div class="form-group full-width">
                    <label>وصف مختصر</label>
                    <textarea id="f_desc" class="form-control" rows="3" required placeholder="اكتب نبذة عن الفعالية..."></textarea>
                </div>
                <div class="form-group full-width">
                    <label>صورة البوستر (رفع من الجهاز)</label>
                    <div style="border: 2px dashed rgba(0,0,0,0.1); padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; background: #fafafa;"
                         onclick="document.getElementById('posterUpload').click()"
                         onmouseover="this.style.borderColor='var(--accent-gold)'"
                         onmouseout="this.style.borderColor='rgba(0,0,0,0.1)'">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                        <p style="color: #666; font-size: 0.9rem; font-weight: 600;" id="uploadText">اضغط هنا لاختيار صورة من جهازك</p>
                        <input type="file" id="posterUpload" accept="image/*" style="display: none;"
                               onchange="document.getElementById('uploadText').innerText = this.files[0] ? this.files[0].name : 'اضغط هنا لاختيار صورة من جهازك';">
                    </div>
                </div>
                <div class="form-group full-width">
                    <button type="submit" id="submitBtn" class="btn-submit" style="background: var(--accent-gold); color: var(--primary-navy); font-size: 1.1rem;">
                        إضافة الفعالية للموقع
                    </button>
                </div>
            </form>

            <!-- Management Section -->
            <div class="manage-section">
                <h3>إدارة الفعاليات المضافة</h3>
                <div class="events-table-wrapper">
                    <table class="events-table">
                        <thead>
                            <tr>
                                <th>اسم الفعالية</th>
                                <th>التصنيف</th>
                                <th>الحالة</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="eventsList">
                            <tr><td colspan="4" style="text-align:center; padding:30px; color:#999;">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span id="toastMsg"></span>
    </div>

<script type="module">
import { initializeApp }           from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, orderBy, query }
                                    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { firebaseConfig }          from "../js/firebase-config.js";

lucide.createIcons();

// ─── Firebase init ────────────────────────────────────────────────
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('admin_logged_in');
    window.location.href = 'index.html';
});

// ─── Real-time listener ───────────────────────────────────────────
let unsubscribe = null;

function startRealtimeListener() {
    const q = query(collection(db, 'events'), orderBy('createdAt', 'desc'));
    unsubscribe = onSnapshot(q, snapshot => {
        const events = [];
        snapshot.forEach(d => events.push({ id: d.id, ...d.data() }));
        renderEvents(events);
    });
}

// Start listener immediately since we verified login via redirect script
startRealtimeListener();

// ─── Render table ─────────────────────────────────────────────────
function renderEvents(events) {
    const tbody = document.getElementById('eventsList');
    if (events.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:30px;color:#999;">لا توجد فعاليات مضافة حالياً</td></tr>';
        return;
    }
    const catLabel = { meeting:'لقاءات', program:'برامج', competition:'مسابقات' };
    tbody.innerHTML = events.map(ev => {
        const statusMap = {
            open:  ['status-open',  'مفتوح'],
            soon:  ['status-soon',  'قريباً'],
            ended: ['status-ended', 'انتهى'],
        };
        const [cls, lbl] = statusMap[ev.status] || ['status-soon','—'];
        return `
        <tr>
            <td style="font-weight:600;">${ev.title}</td>
            <td>${catLabel[ev.category] || ev.category}</td>
            <td><span class="status-badge ${cls}">${lbl}</span></td>
            <td>
                <div class="action-btns">
                    <button class="action-btn edit-btn"   title="تعديل" onclick="editEvent('${ev.id}')">
                        <i data-lucide="edit-3"></i>
                    </button>
                    <button class="action-btn delete-btn" title="حذف"   onclick="deleteEvent('${ev.id}')">
                        <i data-lucide="trash-2"></i>
                    </button>
                </div>
            </td>
        </tr>`;
    }).join('');
    lucide.createIcons();
}

// ─── Compress image to fit Firestore 1MB limit ──────────────────
function compressImage(file, maxWidth = 800, quality = 0.6) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > maxWidth) { h = (maxWidth / w) * h; w = maxWidth; }
                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

// ─── Add / Edit form ──────────────────────────────────────────────
let editingId   = null;
let editingImage= null;

const addEventForm = document.getElementById('addEventForm');

addEventForm.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'جاري الحفظ...';

    const fileInput = document.getElementById('posterUpload');

    const doSave = async (imageData) => {
        const data = {
            title:    document.getElementById('f_title').value.trim(),
            category: document.getElementById('f_category').value,
            date:     document.getElementById('f_date').value,
            time:     document.getElementById('f_time').value,
            location: document.getElementById('f_location').value.trim(),
            status:   document.getElementById('f_status').value,
            regLink:  document.getElementById('f_regLink').value.trim(),
            desc:     document.getElementById('f_desc').value.trim(),
            image:    imageData,
        };

        try {
            if (editingId) {
                await updateDoc(doc(db, 'events', editingId), data);
                showToast('✅ تم تحديث الفعالية!');
                cancelEdit();
            } else {
                data.createdAt = new Date().toISOString();
                await addDoc(collection(db, 'events'), data);
                showToast('✅ تمت إضافة الفعالية!');
            }
            addEventForm.reset();
            document.getElementById('uploadText').innerText = 'اضغط هنا لاختيار صورة من جهازك';
        } catch (err) {
            console.error(err);
            showToast('❌ حدث خطأ، حاول مجدداً');
        }
        btn.disabled = false;
        btn.textContent = editingId ? 'تحديث بيانات الفعالية' : 'إضافة الفعالية للموقع';
    };

    if (fileInput.files && fileInput.files[0]) {
        const compressed = await compressImage(fileInput.files[0]);
        doSave(compressed);
    } else {
        doSave(editingImage || null);
    }
});

// ─── Edit ─────────────────────────────────────────────────────────
window.editEvent = async function(id) {
    const row = document.querySelector(`[onclick="editEvent('${id}')"]`)?.closest('tr');
    if (!row) return;

    const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
    const snap = await getDoc(doc(db, 'events', id));
    if (!snap.exists()) return;
    const ev = snap.data();

    editingId    = id;
    editingImage = ev.image || null;

    document.getElementById('f_title').value    = ev.title    || '';
    document.getElementById('f_category').value = ev.category || 'meeting';
    document.getElementById('f_date').value     = ev.date     || '';
    document.getElementById('f_time').value     = ev.time     || '';
    document.getElementById('f_location').value = ev.location || '';
    document.getElementById('f_status').value   = ev.status   || 'open';
    document.getElementById('f_regLink').value  = ev.regLink  || '';
    document.getElementById('f_desc').value     = ev.desc     || '';
    if (ev.image) document.getElementById('uploadText').innerText = 'صورة محفوظة (اضغط لتغييرها)';

    document.getElementById('formTitle').innerText  = 'تعديل الفعالية الحالية';
    const btn = document.getElementById('submitBtn');
    btn.textContent       = 'تحديث بيانات الفعالية';
    btn.style.background  = '#4ade80';
    btn.style.color       = '#fff';

    window.scrollTo({ top: 0, behavior: 'smooth' });
};

function cancelEdit() {
    editingId    = null;
    editingImage = null;
    document.getElementById('formTitle').innerText = 'إضافة فعالية جديدة';
    const btn = document.getElementById('submitBtn');
    btn.textContent      = 'إضافة الفعالية للموقع';
    btn.style.background = 'var(--accent-gold)';
    btn.style.color      = 'var(--primary-navy)';
}

// ─── Delete ───────────────────────────────────────────────────────
window.deleteEvent = async function(id) {
    if (!confirm('هل أنت متأكد من حذف هذه الفعالية؟')) return;
    try {
        await deleteDoc(doc(db, 'events', id));
        showToast('🗑️ تم حذف الفعالية');
    } catch (err) {
        console.error(err);
        showToast('❌ فشل الحذف');
    }
};

// ─── Toast ────────────────────────────────────────────────────────
function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
